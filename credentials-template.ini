[ocba_datalake]
account_url=URL
sas_token_source=TOKEN_SOURCE
sas_token_index=TOKEN_INDEX
container=CONTAINER
blob_source=BLOB_SOURCE
blob_index=BLOB_INDEX

[ocba_dhis2]
server=https://play.dhis2.org/api/
user=username
password=password

[email]
# Set enabled=true and fill in all fields below to activate email alerts.
# Alerts are sent by generate_dhis2.py (on transfer failures) and
# sipca_review.py (on weekly review when action is required).
enabled=false
smtp_host=smtp.example.com
smtp_port=587
smtp_user=sender@example.com
smtp_password=your_password
email_from=sender@example.com
# Comma-separated list of recipients
email_to=recipient1@example.com,recipient2@example.com